    Geburtsdatum:
    <input type="date" name="Geburtsdatum">

    Geschlecht: 
    <br>

    keine Angabe <input type="radio" name="geschlecht" value="keineAngabe">

    <br><br>

    Email: <input type="email" name="email">
    <br><br>
    gewünschte Kontaktzeit:
    <select name="kontaktzeit" multiple>
        <option value="Vormittag">Vormittag</option>
        <option value="Mittag">Mittag</option>
    </select>
    <br><br>

   Interesse:
   <br>

    <br><br>

    <label for="Nachricht" style="vertical-align: top;">Nachricht:*</label>

<br><br>
    <input type="checkbox" name="Newsletter" value="yes">Newsletter
    <br>
    <input type="hidden" name="seite" value="Formular.html">
